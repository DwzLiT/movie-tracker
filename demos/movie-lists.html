<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ed" />
    <title>MovieMatch · Movie lists preview</title>
    <style>
      body { margin: 0; color: #242b35; background: #f5f3ed; font-family: Arial, Helvetica, sans-serif; }
      .preview { width: min(1050px, calc(100% - 36px)); margin: 0 auto; padding: 48px 0; }
      .preview__top { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
      .preview__brand { margin: 0 0 8px; color: #d88768; font-size: 11px; font-weight: 800; letter-spacing: .15em; }
      .preview h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(29px, 5vw, 42px); letter-spacing: -.04em; }
      .preview__sub { margin: 8px 0 0; color: #727c86; font-size: 14px; }
      .preview__user { display: grid; gap: 6px; min-width: 180px; color: #59636e; font-size: 11px; font-weight: 700; }
      .preview__user input { padding: 10px 12px; border: 1px solid #e1ded6; border-radius: 8px; background: #fffefa; font: inherit; font-size: 13px; }
      .preview__note { margin-top: 14px; color: #899098; text-align: center; font-size: 11px; }
      @media (max-width: 600px) { .preview { padding: 28px 0; } .preview__top { align-items: stretch; flex-direction: column; } }
    </style>
  </head>
  <body>
    <main class="preview">
      <div class="preview__top">
        <div>
          <p class="preview__brand">MOVIEMATCH · FEATURE PREVIEW</p>
          <h1>Your movie shelf</h1>
          <p class="preview__sub">Keep your watch plans and favorites together.</p>
        </div>
        <label class="preview__user" for="preview-user">Test user ID
          <input id="preview-user" value="demo-user-1" autocomplete="off" />
        </label>
      </div>
      <div id="movie-lists-root"></div>
      <p class="preview__note">Changes are saved to the configured testapi.io collections.</p>
    </main>
    <script type="module" src="/src/features/movie-lists/demo.jsx"></script>
  </body>
</html>
